<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BATFlow — DOS 7.1 Visual Batch Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>BATFlow</h1>
        <span>Win98 MS-DOS 7.1 visual batch editor · v0.5.0</span>
      </div>
      <div class="toolbar">
        <button id="newProject" type="button">New project</button>
        <label class="button"
          >Import files<input
            id="fileInput"
            type="file"
            multiple
            accept=".bat,.sys,.txt,.batflow.json"
        /></label>
        <button id="exportProject" type="button">Export project</button>
        <button id="exportBat" type="button">Export current BAT</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar left" aria-label="Project and simulation">
        <section>
          <h2>Project files</h2>
          <div id="fileList" class="file-list"></div>
        </section>
        <section class="simulation-panel">
          <h2>Simulation</h2>
          <div id="simulationInputs" class="simulation-inputs"></div>
          <div class="simulation-actions">
            <div class="button-row">
              <button
                id="traceToggle"
                class="toggle-button"
                type="button"
                aria-pressed="true"
              >
                Trace: On
              </button>
            </div>
            <div id="traceSummary" class="trace-summary"></div>
          </div>
        </section>
        <section>
          <h2>Labels</h2>
          <div id="labelList" class="label-list"></div>
        </section>
      </aside>

      <section class="editor-pane">
        <div class="tabs" role="tablist" aria-label="Editor view">
          <button
            role="tab"
            aria-selected="true"
            data-view="diagram"
            class="active"
            type="button"
          >
            Diagram
          </button>
          <button
            role="tab"
            aria-selected="false"
            data-view="source"
            type="button"
          >
            Source
          </button>
          <button
            role="tab"
            aria-selected="false"
            data-view="split"
            type="button"
          >
            Split
          </button>
          <button
            role="tab"
            aria-selected="false"
            data-view="trace"
            type="button"
          >
            Execution trace
          </button>
          <span id="statusText"></span>
        </div>
        <div
          id="appMessage"
          class="app-message"
          role="status"
          aria-live="polite"
        ></div>
        <div id="diagramView" class="diagram"></div>
        <textarea
          id="sourceView"
          class="source hidden"
          spellcheck="false"
        ></textarea>
        <div id="traceView" class="trace-view hidden"></div>
      </section>

      <aside class="sidebar right" aria-label="Inspector and validation">
        <section>
          <h2>Inspector</h2>
          <div id="inspector" class="inspector empty">Select a block.</div>
        </section>
        <section>
          <h2>Validation</h2>
          <div id="validation"></div>
        </section>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
