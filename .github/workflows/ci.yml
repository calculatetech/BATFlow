name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development environment
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        run: npm run test:e2e

      - name: Smoke-test the staged web root
        run: npm run smoke
        env:
          BATFLOW_TEST_RESULTS_DIR: ${{ runner.temp }}/batflow-test-results

      - name: Build and verify release archive
        run: |
          npm run package
          npm run verify:package
          npm run verify:reproducible
          BATFLOW_WEB_ROOT=dist BATFLOW_SMOKE_PORT=41741 npm run smoke
        env:
          BATFLOW_ARTIFACT_DIR: ${{ runner.temp }}/batflow-artifacts
          BATFLOW_TEST_RESULTS_DIR: ${{ runner.temp }}/batflow-test-results

      - name: Audit dependencies
        run: npm audit

      - name: Upload release candidate for human verification
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batflow-0.5.0-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/batflow-artifacts/batflow-0.5.0.zip
            ${{ runner.temp }}/batflow-artifacts/batflow-0.5.0.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Confirm checks did not rewrite tracked files
        run: git diff --exit-code
