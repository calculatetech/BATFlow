name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked development environment
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Install supported browsers
        run: npx playwright install --with-deps firefox chromium

      - name: Run browser acceptance
        run: npm run test:e2e

      - name: Smoke-test the static web root
        run: npm run smoke
        env:
          BATFLOW_TEST_RESULTS_DIR: ${{ runner.temp }}/batflow-test-results

      - name: Confirm checks did not rewrite tracked files
        run: git diff --exit-code
