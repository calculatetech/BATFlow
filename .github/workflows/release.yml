name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require tag and package version agreement
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Install locked development environment
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tagged source
        run: |
          npm run check
          npm run test:e2e
          npm audit

      - name: Build and verify release archive
        run: |
          npm run package
          npm run verify:package
          npm run verify:reproducible
          BATFLOW_WEB_ROOT=dist BATFLOW_SMOKE_PORT=41741 npm run smoke
        env:
          BATFLOW_ARTIFACT_DIR: ${{ runner.temp }}/batflow-artifacts
          BATFLOW_TEST_RESULTS_DIR: ${{ runner.temp }}/batflow-test-results

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ runner.temp }}/batflow-artifacts/batflow-${GITHUB_REF_NAME#v}.zip"
          "${{ runner.temp }}/batflow-artifacts/batflow-${GITHUB_REF_NAME#v}.zip.sha256"
          --repo "$GITHUB_REPOSITORY"
          --title "BATFlow ${GITHUB_REF_NAME#v}"
          --generate-notes
